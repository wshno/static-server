# Synced from wshno/devops settings-sync/files/dependabot/go.yml (built by
# settings-sync/dependabot/build.py): change it there. Stack: GitHub Actions, Docker, Go modules.
#
# Directories are single-level wildcards, one per depth ("/", "/*", "/*/*"); directories without a
# manifest are skipped. Cooldown: 7 days, 14 for GitHub Actions, so the synced workflows are updated
# in wshno/devops (Renovate, 7 days) and synced before Dependabot here proposes the same bump.
# Groups: a dependency goes to the FIRST group that matches; groups that match nothing are harmless.

version: 2
updates:
- package-ecosystem: "github-actions"
  directories:
  - "/"
  - "/.github/actions/*"
  open-pull-requests-limit: 20
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 14
  assignees:
  - "hwinther"
  groups:
    reusable-workflows:
      patterns:
      - "hwinther/reusable-workflows*"

- package-ecosystem: "docker"
  directories:
  - "/"
  - "/*"
  - "/*/*"
  - "/.github/actions/*"
  open-pull-requests-limit: 20
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  groups:
    base-images:
      patterns:
      - "*"

- package-ecosystem: "gomod"
  directories:
  - "/"
  - "/*"
  - "/*/*"
  open-pull-requests-limit: 20
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
