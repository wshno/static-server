name: Tag and release

# Manually dispatched: creates a v* tag (or lets GitVersion pick one), optionally a GitHub Release,
# then dispatches container.yml against the new tag. A tag pushed with GITHUB_TOKEN does not fire
# on.push.tags, so the build is dispatched explicitly here.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. v1.2.3, or 'auto' to bump minor from the latest tag)"
        required: false
        default: "auto"
      release_notes:
        description: "Release notes for this tag"
        required: false
      create_release:
        description: "Create a GitHub Release for this tag"
        required: false
        default: true
        type: boolean
      container_grype_fail_build:
        description: "Fail the container build if Grype finds vulnerabilities (turn off for a release override)"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  tag:
    permissions:
      contents: write
    # No `secrets:` block: the reusable tag-and-release.yml uses only GITHUB_TOKEN
    # (auto-available to called workflows). Avoids the zizmor "secrets unconditionally
    # inherited" finding.
    uses: hwinther/reusable-workflows/.github/workflows/tag-and-release.yml@d2e6be05dd1572b45d5ab663c1216569f09fec59 # v2.21.0
    with:
      tag_name: ${{ inputs.tag_name }}
      release_notes: ${{ inputs.release_notes }}
      create_release: ${{ inputs.create_release }}

  trigger-container-builds:
    needs: tag
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine ref for container builds
        id: ref
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          git fetch --tags --force
          if [ "$TAG" = "auto" ] || [ -z "$TAG" ]; then
            REF=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          else
            REF="$TAG"
          fi
          if [ -z "$REF" ]; then
            echo "::error::Could not resolve a tag ref for container builds."
            exit 1
          fi
          echo "Using ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Dispatch container workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
          GRYPE_FAIL_BUILD: ${{ inputs.container_grype_fail_build }}
        run: gh workflow run container.yml --ref "$REF" -f grype_fail_build="$GRYPE_FAIL_BUILD"
