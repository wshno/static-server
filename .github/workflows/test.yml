name: Test

# TEMPORARY: exercises hwinther/reusable-workflows' new go-build composite at its PR branch SHA.
# Replaced by a pr-build.yml caller (go_enabled: true) once that ships in a release.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build go
        id: go-build
        uses: hwinther/reusable-workflows/.github/actions/go-build@70f69a21aa45a45f143d2b8fa1f6149cd493ace9 # feat/pr-build-go
