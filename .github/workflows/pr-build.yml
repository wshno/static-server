name: CI

# Thin caller: gofmt, go vet, go build and go test (-race, JUnit + Cobertura) via the reusable
# pr-build workflow, with one sticky PR comment and a quality-go artifact. Runs on pushes to main
# too, where every enabled language builds regardless of changes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      checks: write
    uses: hwinther/reusable-workflows/.github/workflows/pr-build.yml@d2e6be05dd1572b45d5ab663c1216569f09fec59 # v2.21.0
    with:
      go_enabled: true
      todo_comment_enabled: false
